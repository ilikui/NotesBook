name: Sync WeRead Reading Records

on:
  # 每天北京时间 00:15（UTC 16:15）同步微信读书
  schedule:
    - cron: "15 16 * * *"
  # 修改同步工作流时自动执行一次，便于验证仓库变量及发布结果
  push:
    paths:
      - ".github/workflows/sync-weread.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weread-sync
  cancel-in-progress: false

jobs:
  sync-build-deploy:
    if: ${{ github.repository == 'ilikui/NotesBook' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NotesBook
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check WeRead API key
        env:
          WEREAD_API_KEY: ${{ secrets.WEREAD_API_KEY }}
        run: |
          if [ -z "$WEREAD_API_KEY" ]; then
            echo "::error::请在 NotesBook 仓库 Settings → Secrets and variables → Actions 中添加 WEREAD_API_KEY。"
            exit 1
          fi

      - name: Fetch WeRead exporter
        run: |
          git clone --depth 1 https://github.com/ilikui/WeRead.git "$RUNNER_TEMP/WeRead"
          python -m pip install --upgrade pip
          python -m pip install requests flomo
          rm -f "$RUNNER_TEMP/WeRead/static/data/weread_notes.json"

      - name: Export WeRead records
        env:
          WEREAD_API_KEY: ${{ secrets.WEREAD_API_KEY }}
          WEREAD_API_GATEWAY: ${{ vars.WEREAD_API_GATEWAY || 'https://i.weread.qq.com/api/agent/gateway' }}
        run: |
          python "$RUNNER_TEMP/WeRead/weread_hugo_exporter.py" --site-dir "$RUNNER_TEMP/WeRead" --skip-memos --skip-markdown
          test -s "$RUNNER_TEMP/WeRead/static/data/weread_notes.json"

      - name: Import records into Quartz content
        env:
          # 用户已明确要求公开微信读书划线与批注；固定启用，避免仓库变量未传入时静默退回元数据模式。
          WEREAD_PUBLISH_NOTES: 'true'
        run: |
          echo "WEREAD_PUBLISH_NOTES=$WEREAD_PUBLISH_NOTES"
          test "$(printf '%s' "$WEREAD_PUBLISH_NOTES" | tr '[:upper:]' '[:lower:]')" = "true"
          python scripts/import_weread_to_quartz.py "$RUNNER_TEMP/WeRead/static/data/weread_notes.json" "content/Resource/微信读书"

      - name: Verify target book note rendering
        run: |
          target="content/Resource/微信读书/书籍/打造第二大脑-00d7d705.md"
          test -s "$target"
          if grep -q "当前页面同步书籍信息与记录数量" "$target"; then
            echo "::error::目标书籍页面仍处于仅元数据模式。"
            exit 1
          fi
          if grep -q "这本书目前没有可导出的划线或批注。" "$target"; then
            echo "::error::目标书籍未导出具体划线或批注；请检查 WeRead API 返回的数据。"
            exit 1
          fi
          if ! grep -Eq '^### [0-9]+\.' "$target"; then
            echo "::error::目标书籍没有生成任何具体记录标题。"
            exit 1
          fi
          echo "目标书籍的具体记录已生成。"

      - name: Commit synchronized reading records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/Resource/微信读书/
          if git diff --cached --quiet; then
            echo "阅读记录没有变化。"
          else
            git commit -m "chore: sync WeRead reading records [skip ci]"
            git push origin HEAD:main
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Quartz dependencies
        run: npm ci

      - name: Build digital garden
        run: node ./quartz/bootstrap-cli.mjs build -d content -v

      - name: Verify published HTML includes note records
        run: |
          test -s "public/Resource/微信读书/书籍/打造第二大脑-00d7d705.html"
          grep -q "阅读记录" "public/Resource/微信读书/书籍/打造第二大脑-00d7d705.html"

      - name: Deploy digital garden
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          commit_message: "Deploy digital garden with synced WeRead records"
