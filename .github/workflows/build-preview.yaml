name: Build and Deploy Preview

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-preview:
    if: ${{ github.repository == 'ilikui/NotesBook' }}
    runs-on: ubuntu-latest
    name: Build Preview
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Build Quartz
        run: node ./quartz/bootstrap-cli.mjs build -d content -v

      - name: Verify build output
        run: |
          test -s public/index.html
          echo "构建产物检查通过"
          find public/ -type f | head -10

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: public-build
          path: public
          if-no-files-found: error

  deploy-to-github-pages:
    # 只允许 main 分支的 push / 手动运行发布；PR 只构建，不覆盖正式站点。
    if: ${{ github.repository == 'ilikui/NotesBook' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    needs: build-preview
    name: Deploy to GitHub Pages
    # 避免多个运行同时向 gh-pages 推送，导致 non-fast-forward。
    concurrency:
      group: notesbook-gh-pages-deploy
      cancel-in-progress: false
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: public-build
          path: public

      - name: Verify downloaded artifact
        run: test -s public/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
