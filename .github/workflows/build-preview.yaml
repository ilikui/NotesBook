name: Build and Deploy Preview

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-preview:
    if: ${{ github.repository == 'ilikui/NotesBook' }}
    runs-on: ubuntu-latest
    name: Build Preview
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Build Quartz
        run: node ./quartz/bootstrap-cli.mjs build -d content -v

      - name: Verify build output
        run: |
          set -euo pipefail
          test -s public/index.html
          test -s public/static/contentIndex.json
          test -s public/Area/AI/index.html
          test -s public/Area/AI/智能体.html
          test -s public/Area/AI/机器学习.html
          # 全站链接自检：Quartz 的链接不带 .html 后缀，必须能对应到实际产物，
          # 否则点击后会落到 404。任何失效链接都会让构建失败。
          python3 scripts/check_links.py public
          echo "页面数量：$(find public -name '*.html' | wc -l)"
          # 历史遗留：站点曾部署在 Netlify，其 Pretty URLs 会把路径 301 到全小写，
          # 而浏览器会永久缓存 301。迁到 Vercel（区分大小写）后，这些缓存下来的
          # 小写地址会 404。用 vercel.json 把它们重定向回正确大小写。
          python3 scripts/gen_vercel_redirects.py public
          if ! git diff --quiet -- vercel.json; then
            echo "::warning::vercel.json 与当前产物不同步，请执行 python3 scripts/gen_vercel_redirects.py public 并提交"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: public-build
          path: public
          if-no-files-found: error

  deploy-to-github-pages:
    # 只允许 main 分支的 push / 手动运行发布；PR 只构建，不覆盖正式站点。
    if: ${{ github.repository == 'ilikui/NotesBook' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    needs: build-preview
    name: Deploy to GitHub Pages
    # 避免多个运行同时向 gh-pages 推送，导致 non-fast-forward。
    concurrency:
      group: notesbook-gh-pages-deploy
      cancel-in-progress: false
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: public-build
          path: public

      - name: Verify downloaded artifact
        run: test -s public/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          cname: wiki.likui.info
