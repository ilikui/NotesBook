name: Build and Deploy Preview

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-preview:
    if: ${{ github.repository == 'ilikui/NotesBook' }}
    runs-on: ubuntu-latest
    name: Build Preview
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Build Quartz
        run: node ./quartz/bootstrap-cli.mjs build -d content -v

      - name: Generate clean URL routes for AI pages
        run: |
          set -euo pipefail
          # Quartz emits flat *.html files, while its links use extensionless URLs.
          # GitHub Pages needs directory index files for these clean URLs.
          while IFS= read -r -d '' page; do
            route="${page%.html}"
            mkdir -p "$route"
            # The copied page is one directory deeper; make its internal links root-relative.
            sed -E 's@(href|src)="\.\./\.\./@\1="/@g' "$page" > "$route/index.html"
          done < <(find public/Area/AI -maxdepth 1 -type f -name '*.html' ! -name 'index.html' -print0)

      - name: Verify build output
        run: |
          set -euo pipefail
          test -s public/index.html
          test -s public/static/contentIndex.json
          test -s public/Area/AI/index.html
          test -s public/Area/AI/人工智能.html
          test -s public/Area/AI/AI专业方向.html
          test -s public/Area/AI/机器学习.html
          test -s public/Area/AI/深度学习.html
          test -s public/Area/AI/智能体/index.html
          test -s public/Area/AI/机器学习/index.html
          test -s public/Area/AI/深度学习/index.html
          AI_PAGE_COUNT=$(find public/Area/AI -maxdepth 1 -type f -name '*.html' | wc -l)
          echo "AI 页面生成数量：$AI_PAGE_COUNT"
          test "$AI_PAGE_COUNT" -ge 15
          echo "首页、搜索索引及 AI 专题页面检查通过"
          find public/Area/AI -maxdepth 1 -type f -name '*.html' | sort

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: public-build
          path: public
          if-no-files-found: error

  deploy-to-github-pages:
    # 只允许 main 分支的 push / 手动运行发布；PR 只构建，不覆盖正式站点。
    if: ${{ github.repository == 'ilikui/NotesBook' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    needs: build-preview
    name: Deploy to GitHub Pages
    # 避免多个运行同时向 gh-pages 推送，导致 non-fast-forward。
    concurrency:
      group: notesbook-gh-pages-deploy
      cancel-in-progress: false
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: public-build
          path: public

      - name: Verify downloaded artifact
        run: test -s public/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          cname: wiki.likui.info
